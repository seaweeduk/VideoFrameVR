name: OpenCode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      (
        contains(github.event.comment.body, ' /oc') ||
        startsWith(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, ' /opencode') ||
        startsWith(github.event.comment.body, '/opencode')
      )
    permissions: { id-token: write, contents: write, pull-requests: write, issues: write, actions: read }
    uses: ./.github/workflows/opencode-comment-agent.yml
    secrets: inherit
    with:
      references: |
        {
          "mpv": {
            "repository": "mpv-player/mpv",
            "description": "Consult only when libmpv client or render API, property, event, hardware decoding, or OpenGL interop behavior needs source verification"
          },
          "openxr": {
            "repository": "KhronosGroup/OpenXR-SDK-Source",
            "description": "Consult only when OpenXR loader, session lifecycle, swapchain, action, or extension behavior needs source verification"
          },
          "vulkan-docs": {
            "repository": "KhronosGroup/Vulkan-Docs",
            "description": "Consult only when a Vulkan specification rule, valid usage, synchronization, external memory, or semaphore contract needs verification"
          },
          "monado": {
            "repository": "https://gitlab.freedesktop.org/monado/monado.git",
            "description": "Consult only when OpenXR runtime behavior on Linux needs source verification"
          },
          "stash": {
            "repository": "stashapp/stash",
            "description": "Consult only when Stash GraphQL API, scene, marker, stream, or authentication behavior needs source verification"
          },
          "opencode": {
            "repository": "anomalyco/opencode",
            "description": "Consult only when OpenCode internals, config, agents, tools, or GitHub workflow behavior need source verification"
          }
        }
      extra-instructions: |
        - Never add unit tests, regression tests, test targets, test frameworks or fixtures. The project has no test code by policy.
        - Keep changes consistent with the surrounding code. The app is one C++17 executable; CMake lists every source file and shader explicitly, so new `.cpp` files and `shaders/` stages must be added to `CMakeLists.txt`.
        - Write pull request titles as user-facing changes; release notes are generated from them.
        - Every pull request body must disclose AI use, or the PR checks fail. Use the template in `.github/pull_request_template.md`, tick "AI used" and name the model and harness on that line, for example `- [x] AI used. Model and harness: <model> in OpenCode (GitHub Actions)`.
        - Say in the pull request body that the change has not been tested on a headset when it affects playback, rendering, input or the menu.
