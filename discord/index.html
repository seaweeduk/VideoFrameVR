<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the VideoFrameVR Discord</title>
  <meta name="description" content="Get help, report bugs, suggest features and chat about VideoFrameVR.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f6fb;
      --card: #ffffff;
      --text: #12244a;
      --muted: #4a5a78;
      --border: #dbe3ef;
      --accent: #3d7fe0;
      --button: #5865f2;
      --button-hover: #4752c4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1428;
        --card: #13213f;
        --text: #eef3fb;
        --muted: #a6b4cc;
        --border: #24365c;
        --accent: #6aa3f5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 40px 32px 32px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
    }
    .logo { width: 88px; height: 88px; display: block; margin: 0 auto 20px; }
    h1 { margin: 0 0 8px; font-size: 1.5rem; line-height: 1.25; text-wrap: balance; }
    .lead { margin: 0 0 28px; color: var(--muted); text-wrap: pretty; }
    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      margin: 0;
      font-weight: 500;
    }
    .spinner {
      width: 18px;
      height: 18px;
      flex: none;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.4s; }
    }
    #check { display: flex; justify-content: center; }
    #check:not(:empty) { margin-top: 12px; }
    button {
      min-height: 44px;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: var(--button);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: var(--button-hover); }
    button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    a { color: var(--accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body
  data-invite-endpoint="https://videoframevr-discord.videoframevr.workers.dev/invite"
  data-sitekey="0x4AAAAAAF29Dme-5ZTDYFaq">
  <main>
    <img class="logo" src="icon.svg" alt="" width="88" height="88">
    <h1>Join the VideoFrameVR Discord</h1>
    <p class="lead">Get help, report bugs, suggest features and chat about the app.</p>

    <p class="status" id="status" role="status" aria-live="polite">
      <span class="spinner" id="spinner" aria-hidden="true"></span>
      <span id="status-text">Checking you're not a bot…</span>
    </p>
    <div id="check"></div>
    <button type="button" id="retry" hidden>Try again</button>

    <noscript>
      <p>This page needs JavaScript for the spam check.</p>
    </noscript>

  </main>

  <script>
    const endpoint = document.body.dataset.inviteEndpoint;
    const sitekey = document.body.dataset.sitekey;
    const statusText = document.getElementById("status-text");
    const spinner = document.getElementById("spinner");
    const retry = document.getElementById("retry");
    let widget;

    function show(text, { busy = false, canRetry = false } = {}) {
      statusText.textContent = text;
      spinner.hidden = !busy;
      retry.hidden = !canRetry;
    }

    async function join(token) {
      show("Getting your invite…", { busy: true });
      try {
        const response = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token }),
        });
        const result = await response.json();
        if (!response.ok || !result.url) throw new Error(result.error || response.status);
        show("Opening Discord…", { busy: true });
        window.location.replace(result.url);
      } catch {
        show("Couldn't get an invite.", { canRetry: true });
      }
    }

    function failed() {
      show("The spam check didn't load.", { canRetry: true });
    }

    retry.addEventListener("click", () => {
      show("Checking you're not a bot…", { busy: true });
      if (widget !== undefined && window.turnstile) {
        turnstile.reset(widget);
      } else {
        window.location.reload();
      }
    });

    window.onTurnstileLoad = () => {
      widget = turnstile.render("#check", {
        sitekey,
        action: "discord-join",
        appearance: "interaction-only",
        callback: join,
        "before-interactive-callback": () => show("One more step: tick the box below."),
        "after-interactive-callback": () => show("Checking you're not a bot…", { busy: true }),
        "error-callback": () => { failed(); return true; },
        "expired-callback": () => turnstile.reset(widget),
      });
    };
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTurnstileLoad&render=explicit"
          async defer onerror="failed()"></script>
</body>
</html>
